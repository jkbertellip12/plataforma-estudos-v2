*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",sans-serif;background:var(--bg);color:var(--ink);font-size:13.5px;letter-spacing:-.02em}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:rgba(255,255,255,.7);color:var(--ink);border-radius:999px;padding:7px 13px;font-size:12.5px;font-weight:500}button.primary{background:var(--acc);color:#fff;border-color:transparent}button:disabled{opacity:.55;cursor:not-allowed}

main{flex:1;padding:20px;max-width:1280px} .top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.card{background:var(--card);backdrop-filter:blur(24px) saturate(160%);border:1px solid rgba(255,255,255,.7);box-shadow:0 8px 28px rgba(0,0,0,.06);border-radius:var(--radius);padding:16px;margin:14px 0;position:relative;overflow:hidden}.card:before{content:"";position:absolute;inset:0 0 auto 0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.9),transparent);pointer-events:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.grid .card{margin:0}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
h1{font-size:24px;margin:4px 0}h2{font-size:17px;margin:0 0 8px}h3{font-size:14px;margin:12px 0 6px}.mut{color:var(--mut)}.small{font-size:11.5px}
.timer{font-family:ui-monospace,SF Mono,monospace;font-size:64px;font-weight:600;letter-spacing:-.04em;text-align:center}
.ring{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;font-weight:600;background:conic-gradient(var(--acc) var(--p,0%),#E5E5EA 0);position:relative}.ring b{background:#fff;border-radius:50%;width:72px;height:72px;display:grid;place-items:center;font-size:16px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.tabs button.active{background:var(--ink);color:#fff}
table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid var(--line);text-align:left;font-size:12.5px}.check{width:18px;height:18px;border:1px solid #999;border-radius:5px;display:inline-grid;place-items:center;cursor:pointer;background:#fff}.check.on{background:var(--acc);color:#fff}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.28);backdrop-filter:blur(6px);display:none;place-items:center;z-index:50;padding:16px}.modal.open{display:grid}.box{background:rgba(255,255,255,.96);border-radius:18px;padding:20px;width:min(620px,100%);max-height:92vh;overflow:auto;color:#1D1D1F}
.flash{width:min(520px,100%);min-height:300px;perspective:1000px;cursor:pointer;margin:14px auto}.flash-inner{position:relative;width:100%;height:300px;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.16,1,.3,1)}.flash.flipped .flash-inner{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;background:#fff;border-radius:18px;display:grid;place-items:center;padding:24px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.1);font-size:18px}.face.back{transform:rotateY(180deg)}
canvas{width:100%;height:140px}.pill{display:inline-block;padding:3px 9px;border-radius:999px;background:#EFEFF4;font-size:11px}
@media(max-width:820px){.grid,.grid3{grid-template-columns:1fr}aside{position:fixed;z-index:20}body.collapsed aside{width:64px}main{padding-left:80px}.timer{font-size:48px}}

<script>
const $=s=>document.querySelector(s); const uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);
let S=JSON.parse(localStorage.getItem('central_v2')||'null')||{editais:[],studies:[],revisions:[],events:[],sims:[],quests:[],fcSubjects:[],flashcards:[],fcSessions:[],habits:[],habitMarks:{},profile:{display:'Estudante',full:'',gender:''},theme:'padrao',iface:{font:100,density:'normal',radius:16},dashHidden:[],intervals:[1,3,7,14],backups:[],autoBackup:true,lastBackup:null,versions:[{v:'2.0.0',name:'Estrutura inicial',date:new Date().toISOString(),summary:'Sistema completo v2.0.0 — todos os módulos.'}]};
function save(){localStorage.setItem('central_v2',JSON.stringify(S));render();queueSync()}
function queueSync(){ $('#syncSt').textContent = navigator.onLine?'● Sincronizado':'○ Pendente — offline, salvo localmente'; }
window.addEventListener('online',queueSync);window.addEventListener('offline',queueSync);
const activeEdital=()=>S.editais.find(e=>e.status==='ativo');
const fmt=s=>{s=Math.max(0,Math.floor(s));return String(Math.floor(s/3600)).padStart(2,'0')+':'+String(Math.floor(s/60)%60).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
const today=()=>new Date().toISOString().slice(0,10); const dbr=d=>d?d.split('-').reverse().join('/'):'—';
const mastery=e=>{if(!e)return null;let tot=0,done=0;e.materias.forEach(m=>m.assuntos.forEach(a=>a.subs.forEach(s=>{tot++;if(s.done)done++})));return tot?Math.round(done/tot*100):0};
const totalStudy=(editalId,from,to)=>S.studies.filter(x=>(!editalId||x.editalId===editalId)&&(!from||x.date>=from)&&(!to||x.date<=to)).reduce((a,x)=>a+x.seconds,0);
let timer={running:false,paused:false,secs:0,blocks:[],startedAt:null,origin:null,revisionId:null,fc:false,interval:null};
let flash={list:[],idx:0,results:{},skipped:new Set(),secs:0,interval:null,flipped:false};
function singleTimerGuard(){ if(timer.running||timer.paused||flash.interval){alert('Já existe uma cronometragem em andamento. Finalize, zere ou encerre a atual antes de iniciar outra.');return false} return true }
function startTimer(origin,rev){ if(!singleTimerGuard())return; if(origin!=='flash'&&!activeEdital()){alert('É necessário ativar um edital para registrar cronometragem vinculada ao edital.');return} timer={running:true,paused:false,secs:0,blocks:[],startedAt:Date.now(),origin:origin||'dash',revisionId:rev||null,fc:false,interval:setInterval(()=>{timer.secs++;renderTimer()},1000)}; render(); }
function pauseTimer(){ if(!timer.running)return; timer.running=false;timer.paused=true;timer.blocks.push({start:new Date(timer.startedAt).toLocaleTimeString('pt-BR'),end:new Date().toLocaleTimeString('pt-BR'),secs:timer.secs - timer.blocks.reduce((a,b)=>a+b.secs,0)}); clearInterval(timer.interval); render(); }
function resumeTimer(){ if(!timer.paused)return; timer.running=true;timer.paused=false;timer.startedAt=Date.now(); timer.interval=setInterval(()=>{timer.secs++;renderTimer()},1000); render(); }
function zeroTimer(){ if(!confirm('Zerar o cronômetro? O tempo e os blocos ainda não registrados serão apagados.'))return; clearInterval(timer.interval); timer={running:false,paused:false,secs:0,blocks:[],startedAt:null,origin:null,revisionId:null,fc:false,interval:null}; render(); }
function renderTimer(){ const el=$('#timerVal'); if(el) el.textContent=fmt(timer.secs); }
function finishTimer(){ if(!timer.running&&!timer.paused)return; if(timer.paused){} else pauseTimer(); openStudy(true); }
function openStudy(fromTimer){ const e=activeEdital(); let f=`<label>Matéria</label><select id="fMat" onchange="updAss()"><option value="">Selecione</option>${(e?e.materias:[]).map(m=>`<option value="${m.id}">${m.nome}</option>`).join('')}</select><label>Assunto</label><select id="fAss" disabled onchange="updSub()"><option value="">Selecione</option></select><label>Subtópico (opcional)</label><select id="fSub" disabled><option value="">—</option></select><label>Data</label><input id="fDate" type="date" value="${today()}" ${fromTimer?'disabled':''}><label>Observações</label><textarea id="fObs"></textarea><label><input type="checkbox" id="fProg"> Programar estudo</label><label><input type="checkbox" id="fDone" disabled> Marcar subtópico como concluído</label><div id="fBlocks"></div><button onclick="addBlock()">+ Adicionar bloco</button><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px"><button onclick="closeModal('studyModal')">Cancelar</button><button class="primary" onclick="saveStudy(${fromTimer})">Salvar registro</button></div>`; $('#studyForm').innerHTML=f; renderBlocks(); openModal('studyModal'); if(fromTimer&&timer.origin==='revision'){const r=S.revisions.find(x=>x.id===timer.revisionId); if(r){$('#fMat').value=r.materiaId;updAss();$('#fAss').value=r.assuntoId;updSub();$('#fSub').value=r.subId||''; $('#fProg').disabled=true; $('#fProg').parentElement.title='Revisão: não gera nova sequência';}} }
function renderBlocks(){ const c=$('#fBlocks'); if(!c)return; c.innerHTML='<h3>Blocos de estudo</h3>'+(timer.blocks.length?timer.blocks.map((b,i)=>`<div style="display:flex;gap:6px;margin:4px 0"><input type="time" value="${b.start}" onchange="editBlock(${i},'start',this.value)"><input type="time" value="${b.end}" onchange="editBlock(${i},'end',this.value)"><span>${fmt(b.secs)}</span><button onclick="delBlock(${i})">Excluir</button></div>`).join(''):'<p class="mut small">Nenhum bloco. Adicione manualmente ou use o cronômetro.</p>')+`<p><b>Total:</b> ${fmt(timer.blocks.reduce((a,b)=>a+b.secs,0)||timer.secs)}</p>`; }
function addBlock(){ timer.blocks.push({start:'08:00',end:'09:00',secs:3600}); renderBlocks(); }
function editBlock(i,k,v){ timer.blocks[i][k]=v; const [h1,m1]=timer.blocks[i].start.split(':').map(Number),[h2,m2]=timer.blocks[i].end.split(':').map(Number); let d=(h2*60+m2)-(h1*60+m1); if(d<1){alert('O término deve ser posterior ao início, com no mínimo 1 minuto.');return} timer.blocks[i].secs=d*60; renderBlocks(); }
function delBlock(i){ timer.blocks.splice(i,1); renderBlocks(); }
function updAss(){ const e=activeEdital(),m=e?.materias.find(x=>x.id===$('#fMat').value); $('#fAss').disabled=!m; $('#fAss').innerHTML='<option value="">Selecione</option>'+(m?m.assuntos.map(a=>`<option value="${a.id}">${a.nome}</option>`).join(''):''); updSub(); }
function updSub(){ const e=activeEdital(),m=e?.materias.find(x=>x.id===$('#fMat').value),a=m?.assuntos.find(x=>x.id===$('#fAss').value); $('#fSub').disabled=!a; $('#fSub').innerHTML='<option value="">—</option>'+(a?a.subs.map(s=>`<option value="${s.id}">${s.nome}</option>`).join(''):''); $('#fDone').disabled=!$('#fSub').value; }
function saveStudy(fromTimer){ const e=activeEdital(); if(!e){alert('Ative um edital.');return} const mat=$('#fMat').value, ass=$('#fAss').value, sub=$('#fSub').value; if(!mat||!ass){alert('Matéria e Assunto são obrigatórios.');return} let secs=timer.blocks.reduce((a,b)=>a+b.secs,0); if(!fromTimer) secs=3600; if(secs<60){alert('Duração mínima de 1 minuto.');return} const date=$('#fDate').value||today(); const st={id:uid(),editalId:e.id,materiaId:mat,assuntoId:ass,subId:sub||null,date,seconds:secs,obs:$('#fObs').value,origin:fromTimer?'cronometro':'manual',blocks:timer.blocks}; S.studies.push(st);
 if($('#fDone').checked&&sub){ const s=e.materias.flatMap(m=>m.assuntos).flatMap(a=>a.subs).find(x=>x.id===sub); if(s){s.done=true;s.lastStudy=date} }
 if($('#fProg').checked&&!timer.revisionId){ S.intervals.slice().sort((a,b)=>a-b).forEach(d=>{ const dt=new Date(date+'T12:00:00'); dt.setDate(dt.getDate()+d); S.revisions.push({id:uid(),editalId:e.id,materiaId:mat,assuntoId:ass,subId:sub||null,date:dt.toISOString().slice(0,10),originId:st.id,status:'pendente',obs:''}) }) }
 if(timer.revisionId){ const r=S.revisions.find(x=>x.id===timer.revisionId); if(r) r.status='concluida'; }
 clearInterval(timer.interval); timer={running:false,paused:false,secs:0,blocks:[],startedAt:null,origin:null,revisionId:null,fc:false,interval:null}; closeModal('studyModal'); save(); alert('Registro salvo.'); }
function openModal(id){document.getElementById(id).classList.add('open')} function closeModal(id){document.getElementById(id).classList.remove('open')}
function toggleMenu(){document.body.classList.toggle('collapsed');localStorage.setItem('menuCollapsed',document.body.classList.contains('collapsed'))}
if(localStorage.getItem('menuCollapsed')==='true')document.body.classList.add('collapsed');
const NAV=[['dash','◷ Dashboard'],['edital','▤ Edital'],['revisoes','↻ Revisões'],['planej','▦ Planejamento'],['crono','◔ Cronometragem'],['sim','▣ Simulados e Questões'],['flash','▭ Flashcards'],['pers','✦ Personalização'],['config','⚙ Configurações']];
let cur='dash'; function show(id){cur=id;render()}
document.getElementById('nav').innerHTML=NAV.map(n=>`<button data-nav="${n[0]}" onclick="show('${n[0]}')"><i>${n[1].split(' ')[0]}</i><span>${n[1].split(' ').slice(1).join(' ')}</span></button>`).join('');
function applyTheme(){document.documentElement.dataset.theme=S.theme==='padrao'?'':S.theme; document.body.style.fontSize=(S.iface.font||100)+'%'}
function revisionLabel(r){ const e=S.editais.find(x=>x.id===r.editalId); const m=e?.materias.find(x=>x.id===r.materiaId),a=m?.assuntos.find(x=>x.id===r.assuntoId),s=a?.subs.find(x=>x.id===r.subId); return [m?.nome,a?.nome,s?.nome].filter(Boolean).join(' › ')||'Revisão'; }
function openRevision(r){ const isToday=r.date===today(), isLate=r.date<today(); if(r.status==='concluida'){alert(revisionLabel(r)+'\nRevisão concluída. Somente consulta.');return} let btns=''; if(isToday||isLate) btns=`<button class="primary" onclick="startFromRevision('${r.id}')">Revisar esta matéria</button><button onclick="completeRevNoTime('${r.id}')">Concluir revisão sem cronometrar</button>`; $('#gmTitle').textContent='Revisão — '+dbr(r.date); $('#gmBody').innerHTML=`<p>${revisionLabel(r)}</p><p class="mut">${r.obs||''}</p>${btns}<button onclick="delRevision('${r.id}')">Excluir revisão</button>`; $('#gmOk').style.display='none'; openModal('genericModal'); }
function startFromRevision(id){ if(!singleTimerGuard())return; const r=S.revisions.find(x=>x.id===id); closeModal('genericModal'); startTimer('revision',id); }
function completeRevNoTime(id){ const r=S.revisions.find(x=>x.id===id); r.status='concluida'; closeModal('genericModal'); save(); }
function delRevision(id){ if(!confirm('Excluir esta revisão? Esta ação não poderá ser desfeita.'))return; S.revisions=S.revisions.filter(x=>x.id!==id); closeModal('genericModal'); save(); }
function habitWeek(){ const d=new Date(); const mon=new Date(d); mon.setDate(d.getDate()-((d.getDay()+6)%7)); return Array.from({length:7},(_,i)=>{const x=new Date(mon);x.setDate(mon.getDate()+i);return x.toISOString().slice(0,10)}); }
function render(){
 applyTheme(); $('#greet').textContent=`Olá, ${S.profile.display||'Estudante'} — ${new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'})}`;
 document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===cur));
 $('#title').textContent=NAV.find(n=>n[0]===cur)[1].split(' ').slice(1).join(' ');
 const V=$('#view');
 if(cur==='dash') V.innerHTML=dashHTML();
 if(cur==='edital') V.innerHTML=editalHTML();
 if(cur==='revisoes') V.innerHTML=revisoesHTML();
 if(cur==='planej') V.innerHTML=planejHTML();
 if(cur==='crono') V.innerHTML=cronoHTML();
 if(cur==='sim') V.innerHTML=simHTML();
 if(cur==='flash') V.innerHTML=flashHTML();
 if(cur==='pers') V.innerHTML=persHTML();
 if(cur==='config') V.innerHTML=configHTML();
 queueSync();
}
function dashHTML(){ const e=activeEdital(); const t=today(); const todays=[...S.revisions.filter(r=>r.date===t&&r.status!=='concluida').map(r=>({type:'Revisão',label:revisionLabel(r),id:r.id,kind:'rev'})),...S.events.filter(x=>x.date===t).map(x=>({type:'Evento',label:x.nome,id:x.id,kind:'ev'}))]; const late=S.revisions.filter(r=>r.date<t&&r.status!=='concluida');
 const next=[]; for(let i=1;i<=3;i++){const d=new Date();d.setDate(d.getDate()+i);const ds=d.toISOString().slice(0,10); S.revisions.filter(r=>r.date===ds&&r.status!=='concluida').forEach(r=>next.push({label:revisionLabel(r),date:ds})); S.events.filter(x=>x.date===ds).forEach(x=>next.push({label:x.nome,date:ds}));}
 const week=habitWeek(); const hidden=new Set(S.dashHidden);
 const cards={timer:`<div class="card"><h2>Cronômetro de Estudos</h2><div class="timer" id="timerVal">${fmt(timer.secs)}</div><div style="text-align:center;display:flex;gap:8px;justify-content:center">${!timer.running&&!timer.paused?`<button class="primary" onclick="startTimer()">Iniciar</button>`:timer.running?`<button onclick="pauseTimer()">Pausar</button>`:`<button class="primary" onclick="resumeTimer()">Retomar</button>`}${(timer.running||timer.paused)?`<button onclick="finishTimer()">Finalizar</button><button onclick="zeroTimer()">Zerar</button>`:''}</div><p class="small mut" style="text-align:center">Blocos: ${timer.blocks.map(b=>b.start+'–'+b.end).join(', ')||'—'}</p></div>`,
 exam:e?`<div class="card"><h2>Próxima Prova</h2><p>${new Date(e.dataProva+'T12:00')>new Date()?`Futuro ${e.cargo}, faltam ${Math.ceil((new Date(e.dataProva+'T12:00')-new Date())/86400000)} dias para a prova, em ${dbr(e.dataProva)}.`:(e.dataProva===t?`Prova hoje — ${e.cargo}.`:`Essa etapa passou. Que venham os próximos sonhos ♡`)}</p>${new Date(e.dataProva)<new Date()?`<button onclick="show('edital')">Ver edital</button>`:''}</div>`:`<div class="card"><h2>Próxima Prova</h2><p class="mut">Nenhuma prova vinculada a um edital ativo. Ative um edital para acompanhar.</p></div>`,
 dom:e?`<div class="card"><h2>Domínio do Edital</h2><div class="ring" style="--p:${mastery(e)}%"><b>${mastery(e)}%</b></div><p class="small">${e.cargo}</p></div>`:`<div class="card"><h2>Domínio do Edital</h2><p>▤ Nenhum edital ativo. Ative um edital para acompanhar seu progresso.</p></div>`,
 today:`<div class="card"><h2>Compromissos de Hoje</h2>${late.length?`<p><b>⚠ Atrasadas:</b> ${late.map(r=>`<span class="pill" onclick="openRevision('${r.id}')">${revisionLabel(r)}</span>`).join(' ')}</p>`:''}${todays.length?todays.map(c=>`<div style="padding:8px;border-bottom:1px solid var(--line);cursor:pointer" onclick="${c.kind==='rev'?`openRevision('${c.id}')`:`show('planej')`}"><b>${c.type}</b> — ${c.label}</div>`).join(''):'<p class="mut">Nenhum compromisso hoje.</p>'}</div>`,
 next:`<div class="card"><h2>Próximos Compromissos <span class="small mut">(3 dias)</span></h2><div style="max-height:180px;overflow:auto">${next.length?next.map(n=>`<div style="padding:6px 0;border-bottom:1px solid var(--line)">${dbr(n.date)} — ${n.label}</div>`).join(''):'<p class="mut">Nenhum compromisso nos próximos 3 dias.</p>'}</div></div>`,

function toggleHabit(id,d){ const k=id+'|'+d; S.habitMarks[k]=!S.habitMarks[k]; save(); }
function editalHTML(){ const e=activeEdital(); const tab=S._etab||'ativo'; return `<div style="display:flex;justify-content:space-between"><div class="tabs"><button class="${tab==='ativo'?'active':''}" onclick="S._etab='ativo';save()">Edital Ativo</button><button class="${tab==='cad'?'active':''}" onclick="S._etab='cad';save()">Editais Cadastrados / Não Ativo</button><button class="${tab==='arq'?'active':''}" onclick="S._etab='arq';save()">Editais Arquivados</button></div><button class="primary" onclick="newEdital()">+ Novo Edital</button></div>
 ${tab==='ativo'?(e?`<div class="card"><h2>${e.cargo}</h2><p>${e.orgao||''} • Prova: ${dbr(e.dataProva)} • ${e.dataProva<today()?'Prova realizada':e.dataProva===today()?'Prova hoje':'Em preparação'} • ${e.materias.length} matérias • ${e.materias.reduce((a,m)=>a+m.assuntos.reduce((b,a2)=>b+a2.subs.length,0),0)} subtópicos • Tempo: ${fmt(totalStudy(e.id))} • Domínio: ${mastery(e)}%</p><div style="height:10px;background:#E5E5EA;border-radius:99px"><div style="width:${mastery(e)}%;height:100%;background:var(--acc);border-radius:99px"></div></div><p>${e.obs||''}</p><div style="display:flex;gap:8px"><button onclick="editEdital('${e.id}')">Editar</button><button onclick="archiveEdital('${e.id}')">Arquivar</button></div></div><div class="card"><h2>Estrutura — Matéria → Assunto → Subtópico</h2><button onclick="addMateria('${e.id}')">+ Adicionar matéria</button>${e.materias.map(m=>`<details open style="margin-top:10px"><summary><b>${m.nome}</b></summary>${m.assuntos.map(a=>`<div style="margin-left:16px"><b>${a.nome}</b> <button onclick="addSub('${e.id}','${m.id}','${a.id}')">+ Subtópico</button> <button onclick="delAssunto('${e.id}','${m.id}','${a.id}')">Excluir assunto</button>${a.subs.map(s=>`<div style="margin-left:16px;display:flex;gap:8px;align-items:center"><span class="check ${s.done?'on':''}" onclick="toggleSub('${e.id}','${s.id}')">${s.done?'✓':''}</span><span style="${s.done?'text-decoration:line-through':''}">${s.nome}</span><button onclick="editSub('${e.id}','${s.id}')">Editar</button><button onclick="delSub('${e.id}','${s.id}')">Excluir</button></div>`).join('')}</div>`).join('')}<button onclick="addAssunto('${e.id}','${m.id}')">+ Assunto</button> <button onclick="delMateria('${e.id}','${m.id}')">Excluir matéria</button></details>`).join('')||'<p class="mut">Nenhuma matéria. Adicione acima ou importe JSON.</p>'}</div>`: '<div class="card"><p class="mut">Nenhum edital ativo.</p></div>')
 :tab==='cad'?`<div class="card"><h2>Editais Cadastrados</h2>${S.editais.filter(x=>x.status!=='arquivado').map(x=>`<div style="padding:10px;border-bottom:1px solid var(--line)"><b>${x.cargo}</b> — ${x.status} — ${dbr(x.dataProva)} <button onclick="activateEdital('${x.id}')">Ativar</button><button onclick="editEdital('${x.id}')">Editar</button><button onclick="archiveEdital('${x.id}')">Arquivar</button><button onclick="delEdital('${x.id}')">Excluir</button></div>`).join('')||'<p class="mut">Nenhum edital cadastrado.</p>'}</div>`
 :`<div class="card"><h2>Editais Arquivados</h2>${S.editais.filter(x=>x.status==='arquivado').map(x=>`<details><summary><b>${x.cargo}</b> — arquivado</summary><p>${x.orgao} • ${dbr(x.dataProva)}</p><button onclick="unarchiveEdital('${x.id}')">Desarquivar</button><button onclick="delEdital('${x.id}')">Excluir</button></details>`).join('')||'<p class="mut">Nenhum edital arquivado.</p>'}</div>`}`; }
function newEdital(){ $('#gmTitle').textContent='Novo Edital'; $('#gmBody').innerHTML=`<label>Cargo</label><input id="neCargo"><label>Órgão</label><input id="neOrgao"><label>Data da prova</label><input id="neData" type="date"><label>Observações</label><textarea id="neObs"></textarea>${activeEdital()?'<label><input type="checkbox" id="neOnly"> Somente cadastrar (manter edital ativo atual)</label>':''}<h3>Importar por JSON</h3><textarea id="neJson" placeholder='{"cargo":"...","orgao":"...","dataProva":"2026-12-01","materias":[{"nome":"...","assuntos":[{"nome":"...","subs":["..."]}]}]}'></textarea><input type="file" id="neFile" accept=".json" onchange="loadJsonFile(this)"><p class="small mut">Exemplo: id, nome, cargo, órgão, dataProva, matérias, assuntos e subtópicos. Visualize antes de confirmar.</p>`; $('#gmOk').style.display=''; $('#gmOk').onclick=()=>{let data=null; const j=$('#neJson').value.trim(); if(j){try{data=JSON.parse(j)}catch(e){alert('JSON inválido');return}} const cargo=$('#neCargo').value||data?.cargo; if(!cargo){alert('Informe o cargo.');return} if(activeEdital()&&!$('#neOnly')?.checked){alert('Já existe um edital ativo. Marque “Somente cadastrar”.');return} const ed={id:uid(),cargo,orgao:$('#neOrgao').value||data?.orgao||'',dataProva:$('#neData').value||data?.dataProva||'',obs:$('#neObs').value,status:activeEdital()?'cadastrado':'ativo',materias:[]}; if(data?.materias) ed.materias=data.materias.map(m=>({id:uid(),nome:m.nome||m.name,assuntos:(m.assuntos||[]).map(a=>({id:uid(),nome:a.nome||a.name,subs:(a.subs||a.subtopicos||[]).map(s=>({id:uid(),nome:typeof s==='string'?s:s.nome,done:false}))}))})); S.editais.push(ed); closeModal('genericModal'); save();}; openModal('genericModal'); }
function loadJsonFile(inp){ const r=new FileReader(); r.onload=()=>{$('#neJson').value=r.result}; r.readAsText(inp.files[0]); }
function editEdital(id){ const e=S.editais.find(x=>x.id===id); const cargo=prompt('Cargo',e.cargo); if(cargo!==null)e.cargo=cargo; const org=prompt('Órgão',e.orgao); if(org!==null)e.orgao=org; const d=prompt('Data da prova (AAAA-MM-DD)',e.dataProva); if(d!==null)e.dataProva=d; save(); }
function activateEdital(id){ if(!confirm('Ativar este edital? O atual deixará de ser ativo (dados preservados).'))return; S.editais.forEach(e=>{if(e.status==='ativo')e.status='cadastrado'}); S.editais.find(e=>e.id===id).status='ativo'; save(); }
function archiveEdital(id){ if(!confirm('Arquivar este edital?'))return; S.editais.find(e=>e.id===id).status='arquivado'; save(); }
function unarchiveEdital(id){ S.editais.find(e=>e.id===id).status='cadastrado'; save(); }
function delEdital(id){ if(!confirm('Excluir este edital e TODOS os seus dados vinculados (estudos, revisões, planejamentos)? Eventos gerais e Flashcards serão preservados.'))return; S.editais=S.editais.filter(e=>e.id!==id); S.studies=S.studies.filter(s=>s.editalId!==id); S.revisions=S.revisions.filter(r=>r.editalId!==id); save(); }
function addMateria(edId){ const n=prompt('Nome da matéria'); if(!n)return; S.editais.find(e=>e.id===edId).materias.push({id:uid(),nome:n,assuntos:[]}); save(); }
function addAssunto(edId,mId){ const n=prompt('Nome do assunto'); if(!n)return; S.editais.find(e=>e.id===edId).materias.find(m=>m.id===mId).assuntos.push({id:uid(),nome:n,subs:[]}); save(); }
function addSub(edId,mId,aId){ const n=prompt('Nome do subtópico'); if(!n)return; S.editais.find(e=>e.id===edId).materias.find(m=>m.id===mId).assuntos.find(a=>a.id===aId).subs.push({id:uid(),nome:n,done:false}); save(); }
function toggleSub(edId,subId){ const e=S.editais.find(x=>x.id===edId); const s=e.materias.flatMap(m=>m.assuntos).flatMap(a=>a.subs).find(x=>x.id===subId); s.done=!s.done; s.lastStudy=s.done?today():undefined; save(); }
function editSub(edId,subId){ const e=S.editais.find(x=>x.id===edId); const s=e.materias.flatMap(m=>m.assuntos).flatMap(a=>a.subs).find(x=>x.id===subId); const n=prompt('Editar subtópico',s.nome); if(n)s.nome=n; save(); }
function delSub(edId,subId){ if(!confirm('Excluir subtópico?'))return; const e=S.editais.find(x=>x.id===edId); e.materias.forEach(m=>m.assuntos.forEach(a=>a.subs=a.subs.filter(s=>s.id!==subId))); save(); }
function delMateria(edId,mId){ if(!confirm('Excluir matéria e toda sua estrutura?'))return; const e=S.editais.find(x=>x.id===edId); e.materias=e.materias.filter(m=>m.id!==mId); save(); }
function delAssunto(edId,mId,aId){ if(!confirm('Excluir assunto?'))return; const e=S.editais.find(x=>x.id===edId); e.materias.find(m=>m.id===mId).assuntos=e.materias.find(m=>m.id===mId).assuntos.filter(a=>a.id!==aId); save(); }
function revisoesHTML(){ const f=S._rfilter||'hoje'; const t=today(); const list=S.revisions.filter(r=> f==='hoje'?r.date===t&&r.status!=='concluida': f==='atrasadas'?r.date<t&&r.status!=='concluida': f==='proximas'?r.date>t&&r.status!=='concluida': r.status==='concluida'); return `<div class="tabs">${['hoje','atrasadas','proximas','concluidas'].map(x=>`<button class="${f===x?'active':''}" onclick="S._rfilter='${x}';save()">${x[0].toUpperCase()+x.slice(1)}</button>`).join('')}</div><div class="card"><h2>Revisões — ${f}</h2>${list.map(r=>`<div style="padding:8px;border-bottom:1px solid var(--line);cursor:pointer" onclick="openRevision('${r.id}')">${dbr(r.date)} — ${revisionLabel(r)} <span class="pill">${r.status}</span></div>`).join('')||'<p class="mut">Nenhuma revisão neste filtro.</p>'}</div>`; }
let calYM={y:new Date().getFullYear(),m:new Date().getMonth()};
function planejHTML(){ const y=calYM.y,m=calYM.m; const first=new Date(y,m,1); const startDay=(first.getDay()+6)%7; const days=new Date(y,m+1,0).getDate(); let cells=''; for(let i=0;i<startDay;i++)cells+='<div></div>'; for(let d=1;d<=days;d++){ const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`; const items=[...S.revisions.filter(r=>r.date===ds).map(r=>({t:revisionLabel(r),id:r.id,kind:'rev'})),...S.events.filter(e=>e.date===ds).map(e=>({t:e.nome,id:e.id,kind:'ev'}))]; const isToday=ds===today(); cells+=`<div style="border:1px solid var(--line);border-radius:10px;padding:6px;min-height:86px;${isToday?'background:#E8F0FF':''}"><div style="display:flex;justify-content:space-between"><b>${d}</b>${ds>=today()?`<button onclick="newPlanItem('${ds}')">+</button>`:''}</div>${items.slice(0,3).map(it=>`<div class="small" style="background:#fff;border-radius:6px;padding:3px;margin:2px 0;cursor:pointer" onclick="${it.kind==='rev'?`openRevision('${it.id}')`:`editEvent('${it.id}')`}">${it.t}</div>`).join('')}${items.length>3?`<button onclick="showDay('${ds}')">Ver mais (${items.length})</button>`:''}</div>`; }
 return `<div class="card"><div style="display:flex;gap:8px;align-items:center"><button onclick="calYM.m--;if(calYM.m<0){calYM.m=11;calYM.y--}render()">‹</button><h2>${first.toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}</h2><button onclick="calYM.m++;if(calYM.m>11){calYM.m=0;calYM.y++}render()">›</button><button onclick="calYM={y:new Date().getFullYear(),m:new Date().getMonth()};render()">Hoje</button></div><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center"><b>Seg</b><b>Ter</b><b>Qua</b><b>Qui</b><b>Sex</b><b>Sáb</b><b>Dom</b>${cells}</div></div>`; }
function newPlanItem(ds){ const tipo=prompt('Tipo: digite Revisão ou Evento','Revisão'); if(!tipo)return; if(tipo.toLowerCase().startsWith('rev')){ if(!activeEdital()){alert('Ative um edital para criar revisão.');return} const e=activeEdital(); const mat=prompt('Matéria (nome exato): '+e.materias.map(m=>m.nome).join(', ')); const m=e.materias.find(x=>x.nome===mat); if(!m){alert('Matéria não encontrada.');return} const ass=prompt('Assunto: '+m.assuntos.map(a=>a.nome).join(', ')); const a=m.assuntos.find(x=>x.nome===ass); if(!a){alert('Assunto não encontrado.');return} const sub=prompt('Subtópico (opcional): '+a.subs.map(s=>s.nome).join(', '))||''; const s=a.subs.find(x=>x.nome===sub); S.revisions.push({id:uid(),editalId:e.id,materiaId:m.id,assuntoId:a.id,subId:s?.id||null,date:ds,status:'pendente',obs:''}); save(); } else { const nome=prompt('Nome do evento'); if(!nome)return; const hora=prompt('Horário (HH:MM)','09:00')||''; const obs=prompt('Observações')||''; S.events.push({id:uid(),nome,date:ds,hora,obs}); save(); } }
function showDay(ds){ const items=[...S.revisions.filter(r=>r.date===ds),...S.events.filter(e=>e.date===ds)]; alert(dbr(ds)+'\n'+items.map(i=>i.nome||revisionLabel(i)).join('\n')); }
function editEvent(id){ const ev=S.events.find(x=>x.id===id); const n=prompt('Nome',ev.nome); if(n!==null)ev.nome=n; const h=prompt('Horário',ev.hora||''); if(h!==null)ev.hora=h; save(); }
function cronoHTML(){ const from=S._cfrom||'',to=S._cto||''; const list=S.studies.filter(s=>(!from||s.date>=from)&&(!to||s.date<=to)).sort((a,b)=>b.date.localeCompare(a.date)); const byDay={}; list.forEach(s=>byDay[s.date]=(byDay[s.date]||0)+s.seconds); const labels=Object.keys(byDay).sort(); return `<div class="card"><h2>Período de visualização</h2><div style="display:flex;gap:8px;flex-wrap:wrap"><input type="date" id="cf" value="${from}" onchange="S._cfrom=this.value;save()"><input type="date" id="ct" value="${to}" onchange="S._cto=this.value;save()"><button onclick="setPeriod('today')">Hoje</button><button onclick="setPeriod(7)">Últimos 7 dias</button><button onclick="setPeriod(30)">Últimos 30 dias</button><button onclick="setPeriod('month')">Mês atual</button><button onclick="S._cfrom='';S._cto='';save()">Limpar período</button></div></div><div class="grid"><div class="card"><h2>Tempo total no período</h2><p style="font-size:28px">${fmt(list.reduce((a,s)=>a+s.seconds,0))}</p></div><div class="card"><h2>Evolução das horas de estudo</h2><canvas id="chart1"></canvas></div></div><div class="card"><h2>Histórico de registros</h2>${list.map(s=>{const e=S.editais.find(x=>x.id===s.editalId); const m=e?.materias.find(x=>x.id===s.materiaId),a=m?.assuntos.find(x=>x.id===s.assuntoId),sub=a?.subs.find(x=>x.id===s.subId); return `<div style="padding:8px;border-bottom:1px solid var(--line)">${dbr(s.date)} • ${fmt(s.seconds)} • ${s.origin} • ${[m?.nome,a?.nome,sub?.nome].filter(Boolean).join(' › ')||'Flashcards'} • ${s.obs||''} <button onclick="editStudy('${s.id}')">Editar</button><button onclick="delStudy('${s.id}')">Excluir</button></div>`}).join('')||'<p class="mut">Nenhum registro no período.</p>'}</div>`; setTimeout(()=>drawChart('chart1',labels,labels.map(d=>Math.round(byDay[d]/3600*100)/100)),50); }
function setPeriod(p){ const t=new Date(); if(p==='today'){S._cfrom=today();S._cto=today()} else if(p==='month'){S._cfrom=t.toISOString().slice(0,8)+'01';S._cto=today()} else {const d=new Date();d.setDate(d.getDate()-(p-1));S._cfrom=d.toISOString().slice(0,10);S._cto=today()} save(); }
function drawChart(id,labels,vals){ const c=document.getElementById(id); if(!c)return; const ctx=c.getContext('2d'); const W=c.width=600,H=c.height=160; ctx.clearRect(0,0,W,H); if(!vals.length){ctx.fillStyle='#52525A';ctx.fillText('Sem dados no período.',20,80);return} const max=Math.max(...vals,1); ctx.strokeStyle='#007AFF';ctx.lineWidth=2;ctx.beginPath(); vals.forEach((v,i)=>{const x=20+i*(560/Math.max(vals.length-1,1)),y=140-(v/max)*110; i?ctx.lineTo(x,y):ctx.moveTo(x,y)}); ctx.stroke(); ctx.fillStyle='#1D1D1F'; labels.forEach((l,i)=>{ctx.fillText(l.slice(5),20+i*(560/Math.max(vals.length-1,1)),155)}); }
function editStudy(id){ const s=S.studies.find(x=>x.id===id); const obs=prompt('Observações',s.obs||''); if(obs!==null)s.obs=obs; if(s.origin!=='cronometro'){const d=prompt('Data (AAAA-MM-DD)',s.date); if(d&&d<=today())s.date=d} const mins=prompt('Duração em minutos',Math.round(s.seconds/60)); if(mins&&Number(mins)>=1)s.seconds=Number(mins)*60; save(); }
function delStudy(id){ if(!confirm('Excluir este registro?'))return; S.studies=S.studies.filter(s=>s.id!==id); save(); }
function simHTML(){ const sims=S.sims, qs=S.quests; const avg=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):0; const ap=a=>a.length?Math.round(a.reduce((x,y)=>x+(y.corretas/y.total*100||0),0)/a.length):0; const best=sims.length?Math.max(...sims.map(s=>Math.round(s.corretas/s.total*100||0))):0;
 return `<div style="display:flex;gap:8px;justify-content:flex-end"><button class="primary" onclick="newSim()">+ Novo Simulado</button><button onclick="newQuest()">+ Novo Bloco de Questões</button></div><div class="card"><h2>Simulados — indicadores</h2><p>Média de acertos: ${avg(sims.map(s=>s.corretas))} • Média de aproveitamento: ${ap(sims)}% • Melhor resultado: ${best}% • Quantidade: ${sims.length}</p><label>Filtro por aproveitamento</label><select id="simBand" onchange="S._band=this.value;save()"><option value="">Todas</option><option value="0-50">Abaixo de 50%</option><option value="50-60">50% a 59%</option><option value="60-70">60% a 69%</option><option value="70-85">70% a 84%</option><option value="85-100">85% ou mais</option></select><button onclick="if(confirm('Zerar estatísticas de Simulados? Todos os simulados serão excluídos.')){S.sims=[];save()}">Zerar Estatísticas — Simulados</button><h3>Evolução de desempenho</h3><canvas id="chartSim"></canvas><h3>Simulados cadastrados</h3>${sims.filter(s=>{if(!S._band)return true; const p=s.corretas/s.total*100; const [a,b]=S._band.split('-').map(Number); return p>=a&&p<b+ (b===100?1:0)}).map(s=>`<div style="padding:8px;border-bottom:1px solid var(--line)">${dbr(s.date)} • <b>${s.nome}</b> • ${s.materia} • ${s.corretas}/${s.total} (${Math.round(s.corretas/s.total*100||0)}%) • Tempo: ${s.tempo||'—'} • ${s.obs||''} <button onclick="editSim('${s.id}')">Editar</button><button onclick="S.sims=S.sims.filter(x=>x.id!=='${s.id}');save()">Excluir</button></div>`).join('')||'<p class="mut">Nenhum simulado.</p>'}</div><div class="card"><h2>Questões — área secundária</h2><p>Média de acertos: ${avg(qs.map(s=>s.corretas))} • Média de aproveitamento: ${ap(qs)}% • Quantidade: ${qs.length}</p><canvas id="chartQ"></canvas><button onclick="if(confirm('Zerar estatísticas de Questões? Todos os blocos serão excluídos.')){S.quests=[];save()}">Zerar Estatísticas — Questões</button>${qs.map(s=>`<div style="padding:8px;border-bottom:1px solid var(--line)">${dbr(s.date)} • ${s.materia} • ${s.corretas}/${s.total} (${Math.round(s.corretas/s.total*100||0)}%) <button onclick="S.quests=S.quests.filter(x=>x.id!=='${s.id}');save()">Excluir</button></div>`).join('')||'<p class="mut">Nenhum bloco de questões.</p>'}</div>`; setTimeout(()=>{drawChart('chartSim',sims.map(s=>s.date),sims.map(s=>Math.round(s.corretas/s.total*100||0)));drawChart('chartQ',qs.map(s=>s.date),qs.map(s=>Math.round(s.corretas/s.total*100||0)))},50); }
function newSim(){ const nome=prompt('Nome/identificação do simulado'); if(!nome)return; const materia=prompt('Matéria (livre)',''); const date=prompt('Data (AAAA-MM-DD)',today()); const total=Number(prompt('Total de questões','10')); const cor=Number(prompt('Corretas','0')); const inc=Number(prompt('Incorretas','0')); const nr=Number(prompt('Não respondidas','0')); if(cor+inc+nr!==total){alert('Corretas + incorretas + não respondidas devem somar o total.');return} const tempo=prompt('Tempo dedicado (informacional)',''); const obs=prompt('Observações','')||''; S.sims.push({id:uid(),nome,materia,date,total,corretas:cor,incorretas:inc,naoResp:nr,tempo,obs}); save(); }
function editSim(id){ const s=S.sims.find(x=>x.id===id); const cor=prompt('Corretas',s.corretas); if(cor!==null)s.corretas=Number(cor); save(); }
function newQuest(){ const materia=prompt('Matéria (livre)',''); if(materia===null)return; const date=prompt('Data',today()); const total=Number(prompt('Total','10')); const cor=Number(prompt('Corretas','0')); const inc=Number(prompt('Incorretas','0')); S.quests.push({id:uid(),materia,date,total,corretas:cor,incorretas:inc,obs:''}); save(); }
function flashHTML(){ const total=S.flashcards.length; const sess=S.fcSessions; const acc=sess.reduce((a,s)=>a+s.acertos,0), err=sess.reduce((a,s)=>a+s.erros,0); return `<div style="display:flex;gap:8px;justify-content:flex-end"><button class="primary" onclick="openFlashSetup()">Estudar</button><button onclick="newFlash()">+ Novo Flashcard</button><button onclick="newFcSubject()">+ Nova Matéria</button><button onclick="importFlash()">Importar Arquivo</button></div><p class="small">Flashcards: ${total} • Matérias: ${S.fcSubjects.length}</p><div class="card"><h2>Desempenho</h2><p>Acertos: ${acc} • Erros: ${err} • Aproveitamento: ${acc+err?Math.round(acc/(acc+err)*100):0}%</p><canvas id="chartFc"></canvas><button onclick="if(confirm('Zerar estatísticas de Flashcards? Flashcards e matérias serão preservados.')){S.fcSessions=[];save()}">Zerar Estatísticas</button></div><div class="card"><h2>Flashcards cadastrados</h2>${S.fcSubjects.map(sub=>`<details><summary><b>${sub.nome}</b> (${S.flashcards.filter(f=>f.subjectId===sub.id).length})</summary>${S.flashcards.filter(f=>f.subjectId===sub.id).map(f=>`<div style="padding:6px;border-bottom:1px solid var(--line)"><b>Q:</b> ${f.q}<br><b>R:</b> ${f.a} • ✓ ${f.acertos||0} • ✗ ${f.erros||0} <button onclick="editFlash('${f.id}')">Editar</button><button onclick="delFlash('${f.id}')">Excluir</button></div>`).join('')||'<p class="mut">Sem flashcards.</p>'}</details>`).join('')||'<p class="mut">Nenhuma matéria de Flashcards.</p>'}</div><div class="card"><h2>Flashcards com Erros</h2>${S.flashcards.filter(f=>(f.erros||0)>0&&!f.hiddenError).map(f=>`<div style="display:flex;gap:10px;padding:8px;border-bottom:1px solid var(--line)"><span>${S.fcSubjects.find(s=>s.id===f.subjectId)?.nome}</span><span>${f.q}</span><span>${f.a}</span><span>✗ ${f.erros}</span><span>✓ ${f.acertos||0}</span><button onclick="hideError('${f.id}')">Remover desta área</button></div>`).join('')||'<p class="mut">Nenhum flashcard com erro.</p>'}</div>`; setTimeout(()=>drawChart('chartFc',sess.map(s=>s.date),sess.map(s=>s.acertos+s.erros?Math.round(s.acertos/(s.acertos+s.erros)*100):0)),50); }
function hideError(id){ S.flashcards.find(f=>f.id===id).hiddenError=true; save(); }
function newFcSubject(){ const n=prompt('Nome da matéria'); if(!n)return; S.fcSubjects.push({id:uid(),nome:n}); save(); }
function newFlash(){ if(!S.fcSubjects.length){alert('Cadastre uma matéria primeiro.');return} const subj=prompt('Matéria: '+S.fcSubjects.map(s=>s.nome).join(', ')); const su=S.fcSubjects.find(s=>s.nome===subj); if(!su){alert('Matéria não encontrada.');return} const q=prompt('Pergunta'); if(!q)return; const a=prompt('Resposta'); if(!a)return; S.flashcards.push({id:uid(),subjectId:su.id,q,a,acertos:0,erros:0}); save(); }
function editFlash(id){ const f=S.flashcards.find(x=>x.id===id); const q=prompt('Pergunta',f.q); if(q!==null)f.q=q; const a=prompt('Resposta',f.a); if(a!==null)f.a=a; save(); }
function delFlash(id){ if(!confirm('Excluir flashcard?'))return; S.flashcards=S.flashcards.filter(f=>f.id!==id); save(); }
function importFlash(){ const txt=prompt('Cole JSON: [{"materia":"...","pergunta":"...","resposta":"..."}] ou CSV com cabeçalho matéria,pergunta,resposta (separador , ou ;)'); if(!txt)return; try{ let rows=[]; if(txt.trim().startsWith('[')){ rows=JSON.parse(txt).map(r=>({materia:r.materia,pergunta:r.pergunta,resposta:r.resposta})) } else { const sep=txt.includes(';')?';':','; const lines=txt.trim().split('\n'); rows=lines.slice(1).map(l=>{const p=l.split(sep); return {materia:p[0],pergunta:p[1],resposta:p[2]}}); } let valid=rows.filter(r=>r.materia&&r.pergunta&&r.resposta), invalid=rows.length-valid.length, dups=0; valid.forEach(r=>{ if(S.flashcards.some(f=>f.q===r.pergunta&&f.a===r.resposta)) dups++; }); if(!confirm(`Prévia: válidas ${valid.length}, inválidas ${invalid}, duplicadas ${dups}. Importar as aptas?`))return; valid.forEach(r=>{ if(S.flashcards.some(f=>f.q===r.pergunta))return; let su=S.fcSubjects.find(s=>s.nome.toLowerCase()===r.materia.trim().toLowerCase()); if(!su){su={id:uid(),nome:r.materia.trim()};S.fcSubjects.push(su)} S.flashcards.push({id:uid(),subjectId:su.id,q:r.pergunta,a:r.resposta,acertos:0,erros:0}); }); save(); }catch(e){alert('Formato inválido.')} }
function openFlashSetup(){ if(!S.fcSubjects.length){alert('Cadastre matérias e flashcards primeiro.');return} $('#flashBody').innerHTML=`<p>Selecione uma ou mais matérias:</p>${S.fcSubjects.map(s=>`<label><input type="checkbox" class="fcSub" value="${s.id}" checked> ${s.nome}</label>`).join('')}<label><input type="checkbox" id="fcInc"> Incluir Flashcards que eu errei</label><label><input type="checkbox" id="fcOnly"> Somente os Flashcards que eu errei</label><div style="display:flex;gap:8px"><button onclick="document.querySelectorAll('.fcSub').forEach(c=>c.checked=true)">Marcar todos</button><button onclick="document.querySelectorAll('.fcSub').forEach(c=>c.checked=false)">Desmarcar todos</button><button class="primary" onclick="startFlash()">Iniciar</button></div>`; openModal('flashModal'); }
function startFlash(){ if(flash.interval){alert('Já existe cronometragem em andamento.');return} const ids=[...document.querySelectorAll('.fcSub:checked')].map(c=>c.value); if(!ids.length){alert('Selecione pelo menos uma matéria.');return} const only=$('#fcOnly').checked, inc=$('#fcInc').checked; let list=S.flashcards.filter(f=>ids.includes(f.subjectId)); if(only) list=list.filter(f=>(f.erros||0)>0); else if(!inc) list=list.filter(f=>!((f.erros||0)>0&&false)); list=[...list].sort(()=>Math.random()-.5); if(!list.length){alert('Nenhum flashcard para esta seleção.');return} flash={list,idx:0,results:{},skipped:new Set(),secs:0,interval:setInterval(()=>{flash.secs++;const e=$('#fcTimer');if(e)e.textContent=fmt(flash.secs)},1000),flipped:false}; showFlash(); }
function showFlash(){ const f=flash.list[flash.idx]; if(!f){endFlash();return} $('#flashBody').innerHTML=`<div style="display:flex;justify-content:space-between"><span>${flash.idx+1} de ${flash.list.length} • <span id="fcTimer">${fmt(flash.secs)}</span></span><button onclick="endFlash()">Encerrar sessão</button></div><div class="flash ${flash.flipped?'flipped':''}" onclick="flipFlash()"><div class="flash-inner"><div class="face"><div><div class="small mut">${S.fcSubjects.find(s=>s.id===f.subjectId)?.nome}</div><p>${f.q}</p><p class="small mut">Clique para virar</p></div></div><div class="face back"><div><p>${f.a}</p></div></div></div></div><div style="text-align:center;display:flex;gap:8px;justify-content:center">${!flash.flipped?`<button onclick="flipFlash()">Virar</button><button onclick="skipFlash()">Pular</button>`:`<button onclick="answerFlash(false)">Errei</button><button class="primary" onclick="answerFlash(true)">Acertei</button>`}<button onclick="backFlash()">Voltar</button></div>`; }
function flipFlash(){ flash.flipped=true; showFlash(); }
function skipFlash(){ flash.skipped.add(flash.list[flash.idx].id); flash.idx++; flash.flipped=false; showFlash(); }
function answerFlash(ok){ const f=flash.list[flash.idx]; const prev=flash.results[f.id]; if(prev==='ok')f.acertos--; if(prev==='err')f.erros--; flash.results[f.id]=ok?'ok':'err'; if(ok)f.acertos=(f.acertos||0)+1; else {f.erros=(f.erros||0)+1; f.hiddenError=false} flash.idx++; flash.flipped=false; showFlash(); }
function backFlash(){ if(flash.idx===0)return; flash.idx--; const f=flash.list[flash.idx]; const r=flash.results[f.id]; if(r==='ok')f.acertos--; if(r==='err')f.erros--; delete flash.results[f.id]; flash.flipped=false; showFlash(); }
function endFlash(){ clearInterval(flash.interval); const res=Object.values(flash.results); const acc=res.filter(x=>x==='ok').length, err=res.filter(x=>x==='err').length, total=acc+err; const secs=flash.secs; const date=today(); if(total>0){ S.fcSessions.push({id:uid(),date,acertos:acc,erros:err,total}); S.studies.push({id:uid(),editalId:null,materiaId:null,assuntoId:null,subId:null,date,seconds:secs,obs:'Sessão Flashcards',origin:'flashcards',blocks:[]}); } flash.interval=null; $('#flashBody').innerHTML=`<h3>Relatório da sessão</h3><p>Total respondido: ${total} • Acertos: ${acc} • Erros: ${err} • Pulados: ${flash.skipped.size} • Aproveitamento: ${total?Math.round(acc/total*100):0}% • Tempo: ${fmt(secs)}</p><button onclick="closeModal('flashModal')">Voltar aos Flashcards</button><button class="primary" onclick="closeModal('flashModal');openFlashSetup()">Nova Sessão</button>`; save(); }
function persHTML(){ const tab=S._ptab||'temas'; return `<div class="tabs">${[['temas','Temas e Aparência'],['habitos','Controle de Hábitos'],['interface','Interface'],['dados','Dados Pessoais'],['revisoes','Revisões']].map(t=>`<button class="${tab===t[0]?'active':''}" onclick="S._ptab='${t[0]}';save()">${t[1]}</button>`).join('')}</div>
 ${tab==='temas'?`<div class="card"><h2>Temas — somente visual</h2>${[['padrao','Padrão — Claro Minimalista'],['rose','Rose Gold — Rosa Pastel'],['cafe','Café — Marrom Elegante'],['dark','Dark — Lavanda Noturna']].map(t=>`<div style="padding:10px;border-bottom:1px solid var(--line)"><b>${t[1]}</b> ${S.theme===t[0]?'<span class="pill">Ativo</span>':''} <button onclick="previewTheme('${t[0]}')">Pré-visualizar</button><button class="primary" onclick="S.theme='${t[0]}';save()">Aplicar Tema</button><button onclick="delTheme('${t[0]}')">Excluir</button></div>`).join('')}<button onclick="S.theme='padrao';save()">Restaurar Tema Padrão</button><p class="small mut">Pré-visualizar é temporário; ao sair sem aplicar, volta ao tema ativo.</p></div>`
 :tab==='habitos'?`<div class="card"><h2>Controle de Hábitos — cadastro e ordem</h2><p class="small mut">O acompanhamento semanal fica apenas no Dashboard.</p>${S.habits.map((h,i)=>`<div style="display:flex;gap:6px;align-items:center;padding:6px;border-bottom:1px solid var(--line)"><span style="flex:1;cursor:text" onclick="editHabit('${h.id}',this)">${h.nome}</span><button ${i===0?'disabled':''} onclick="moveHabit(${i},-1)">↑</button><button ${i===S.habits.length-1?'disabled':''} onclick="moveHabit(${i},1)">↓</button><button onclick="delHabit('${h.id}')">Excluir</button></div>`).join('')||'<p class="mut">Nenhum hábito.</p>'}<div style="display:flex;gap:8px;margin-top:10px"><input id="newHab" maxlength="50" placeholder="Novo hábito"><button class="primary" onclick="addHabit()">Adicionar</button></div><button onclick="if(confirm('Restaurar ordem padrão (ordem de cadastro)?')){S.habits.sort((a,b)=>a.created-b.created);save()}">Restaurar ordem padrão</button></div>`
 :tab==='interface'?`<div class="card"><h2>Interface Pro</h2><label>Tamanho da fonte (%)</label><input type="number" value="${S.iface.font}" onchange="S.iface.font=Number(this.value);save()"><label>Arredondamento dos cards (px)</label><input type="number" value="${S.iface.radius}" onchange="S.iface.radius=Number(this.value);document.documentElement.style.setProperty('--radius',this.value+'px');save()"><button onclick="S.iface={font:100,radius:16};save()">Restaurar Configurações de Interface</button><h3>Interface Dash</h3>${['timer','exam','dom','today','next','habits'].map(k=>`<label><input type="checkbox" ${!S.dashHidden.includes(k)?'checked':''} onchange="toggleDashCard('${k}',this.checked)"> Mostrar: ${k}</label>`).join('')}<button onclick="S.dashHidden=[];save()">Restaurar organização padrão</button></div>`
 :tab==='dados'?`<div class="card"><h2>Dados Pessoais</h2><label>Nome completo</label><input id="pfFull" value="${S.profile.full}"><label>Nome de exibição</label><input id="pfDisp" value="${S.profile.display}"><label>Gênero</label><select id="pfGen"><option value="">—</option><option ${S.profile.gender==='Feminino'?'selected':''}>Feminino</option><option ${S.profile.gender==='Masculino'?'selected':''}>Masculino</option><option ${S.profile.gender==='Outro'?'selected':''}>Outro</option></select><div style="display:flex;gap:8px;margin-top:10px"><button class="primary" onclick="S.profile={full:$('#pfFull').value,display:$('#pfDisp').value||$('#pfFull').value,gender:$('#pfGen').value};save()">Salvar</button><button onclick="S.profile.display=S.profile.full;save()">Restaurar nome de exibição</button></div></div>`
 :`<div class="card"><h2>Revisões — intervalos em dias corridos</h2><p class="small mut">Alterações valem apenas para novos estudos.</p>${S.intervals.map((v,i)=>`<div style="display:flex;gap:6px;margin:4px 0"><span>Revisão ${i+1}</span><input type="number" min="1" step="1" value="${v}" onchange="editInterval(${i},this.value)"><button onclick="S.intervals.splice(${i},1);save()">Excluir</button></div>`).join('')}<button onclick="S.intervals.push(30);save()">+ Adicionar intervalo</button></div>`}`; }
function previewTheme(t){ document.documentElement.dataset.theme=t===''?'':t; setTimeout(()=>{if(confirm('Manter esta pré-visualização? Cancelar retorna ao tema ativo.')){S.theme=t;save()} else applyTheme()},100); }
function delTheme(t){ if(S.theme===t){alert('Aplique outro tema antes de excluir o tema ativo.');return} if(!confirm('Excluir tema? Não poderá ser restaurado.'))return; alert('Tema removido da lista (temas nativos restantes preservados).'); }
function addHabit(){ const v=$('#newHab').value.trim(); if(!v){alert('Informe o nome.');return} if(S.habits.some(h=>h.nome.toLowerCase()===v.toLowerCase())){alert('Hábito já cadastrado.');return} S.habits.push({id:uid(),nome:v,created:Date.now()}); save(); }
function moveHabit(i,d){ const [h]=S.habits.splice(i,1); S.habits.splice(i+d,0,h); save(); }
function delHabit(id){ if(!confirm('Excluir hábito?'))return; S.habits=S.habits.filter(h=>h.id!==id); save(); }
function editHabit(id,el){ const h=S.habits.find(x=>x.id===id); const inp=document.createElement('input'); inp.value=h.nome; inp.maxLength=50; el.replaceWith(inp); inp.focus(); const done=()=>{ const v=inp.value.trim(); if(v&&!S.habits.some(x=>x.id!==id&&x.nome.toLowerCase()===v.toLowerCase())) h.nome=v; save(); }; inp.onblur=done; inp.onkeydown=e=>{if(e.key==='Enter')inp.blur()} }
function toggleDashCard(k,show){ if(show) S.dashHidden=S.dashHidden.filter(x=>x!==k); else if(!S.dashHidden.includes(k)) S.dashHidden.push(k); save(); }
function editInterval(i,v){ v=Number(v); if(!Number.isInteger(v)||v<=0){alert('Use inteiro maior que zero.');save();return} if(S.intervals.some((x,j)=>j!==i&&x===v)){alert('Intervalo duplicado.');save();return} S.intervals[i]=v; S.intervals.sort((a,b)=>a-b); save(); }
function configHTML(){ const tab=S._ctab||'backup'; return `<div class="tabs"><button class="${tab==='backup'?'active':''}" onclick="S._ctab='backup';save()">Backup e Segurança</button><button class="${tab==='versoes'?'active':''}" onclick="S._ctab='versoes';save()">Versões e Atualização</button></div>${tab==='backup'?`<div class="card"><h2>Backup e Segurança</h2><label><input type="checkbox" ${S.autoBackup?'checked':''} onchange="S.autoBackup=this.checked;save()"> Backup automático (ativado por padrão)</label><p>Último backup: ${S.lastBackup?new Date(S.lastBackup).toLocaleString('pt-BR'):'Nunca'}</p><button class="primary" onclick="makeBackup('manual')">Criar backup agora</button><button onclick="exportBackup()">Exportar backup em JSON</button><input type="file" id="bkFile" accept=".json" onchange="importBackup(this)"><h3>Histórico de backups</h3>${S.backups.slice(-10).map(b=>`<div>${new Date(b.date).toLocaleString('pt-BR')} • ${b.type} • v${b.appVersion} • esquema ${b.schema} • ${b.status} <button onclick="restoreBackup('${b.id}')">Restaurar</button><button onclick="S.backups=S.backups.filter(x=>x.id!=='${b.id}');save()">Excluir cópia</button></div>`).join('')||'<p class="mut">Nenhum backup.</p>'}</div>`: `<div class="card"><h2>Versões e Atualização — v2.0.0</h2><p>Versão atual: <b>2.0.0</b> • Publicação: ${new Date(S.versions[0].date).toLocaleString('pt-BR')}</p><p>Atualizações seguem fluxo incremental GitHub → Netlify. Nenhuma atualização apaga dados do usuário. Reversão preserva dados compatíveis e exige confirmação + prévia.</p><details><summary><b>Histórico de versões atualizadas</b> (recolhido por padrão)</summary>${S.versions.map(v=>`<div style="padding:8px;border-bottom:1px solid var(--line)"><b>Versão ${v.v}</b> — ${new Date(v.date).toLocaleString('pt-BR')} — ${v.name}<br>${v.summary} <button onclick="previewRollback('${v.v}')">Reverter para esta versão</button></div>`).join('')}</details></div>`}`; }
function makeBackup(type){ const b={id:uid(),date:new Date().toISOString(),type,appVersion:'2.0.0',schema:1,status:'concluído',data:JSON.parse(JSON.stringify(S))}; delete b.data.backups; S.backups.push(b); if(S.backups.length>20) S.backups=S.backups.slice(-20); S.lastBackup=b.date; save(); alert('Backup criado.'); }
function exportBackup(){ const blob=new Blob([JSON.stringify({appVersion:'2.0.0',schema:1,date:new Date().toISOString(),type:'manual',data:S},null,2)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='central-estudos-backup.json'; a.click(); }
function importBackup(inp){ const r=new FileReader(); r.onload=()=>{ try{ const j=JSON.parse(r.result); const cnt=j.data?Object.keys(j.data).length:0; if(!confirm(`Prévia: versão ${j.appVersion||'?'}, esquema ${j.schema||'?'}, data ${j.date||'?'}, ${cnt} categorias. Restaurar? Um backup de segurança do estado atual será criado antes.`))return; makeBackup('pre-restore'); const d=j.data||j; Object.assign(S,d); save(); alert('Backup restaurado.'); }catch(e){alert('Arquivo inválido.')} }; r.readAsText(inp.files[0]); }
function restoreBackup(id){ if(!confirm('Restaurar este backup? O estado atual será preservado em um backup de segurança.'))return; const b=S.backups.find(x=>x.id===id); makeBackup('pre-restore'); Object.assign(S,b.data); save(); }
function previewRollback(v){ alert(`Prévia de reversão:\nAtual: 2.0.0 → Destino: ${v}\nDados no Supabase/IndexedDB serão preservados se compatíveis. Reversão de código não implica reversão de dados. Operação bloqueada se houver incompatibilidade sem migração segura.`); if(confirm('Confirmar reversão (registro no histórico)?')){ S.versions.unshift({v:v+'-rollback',name:'Reversão',date:new Date().toISOString(),summary:'Reversão registrada para '+v}); save(); } }
render();
</script></body></html>
